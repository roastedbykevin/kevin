name: Desktop Kevin
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
            file: Kevin-Desktop-mac.dmg
          - os: windows-latest
            dist: dist:win
            file: Kevin-Desktop-win.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Smoke test (hidden window, live /sprite must load Kevin)
        run: npm run smoke
      - name: Smoke test with mocked now-playing (Kevin must riff the mocked title)
        run: npm run smoke:media
      - run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: desktop/dist/${{ matrix.file }}
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" out/Kevin-Desktop-mac.dmg out/Kevin-Desktop-win.exe --title "Desktop Kevin ${GITHUB_REF_NAME#desktop-v}" --notes-file desktop/RELEASE.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
